name: Build DIJI-NES Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # 生成标准 firmware.bin
      - name: Build firmware
        run: pio run

      - name: Upload firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: DIJI-NES-firmware
          path: .pio/build/*/firmware.bin

      # 生成合并固件 merged.bin
      - name: Build merged firmware
        run: pio run -t mergebin

      - name: Upload merged.bin
        uses: actions/upload-artifact@v4
        with:
          name: DIJI-NES-merged-firmware
          path: .pio/build/*/merged.bin