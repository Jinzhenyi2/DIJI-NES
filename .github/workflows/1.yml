name: Build DIJI-NES Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware (standard)
        run: pio run

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIJI-NES-firmware
          path: .pio/build/*/firmware.bin

      # （可选）如果项目支持合并固件（带 bootloader），可启用以下步骤
      # - name: Build merged firmware
      #   run: pio run -t mergebin
      # - name: Upload merged firmware
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: DIJI-NES-merged-firmware
      #     path: .pio/build/*/merged.bin