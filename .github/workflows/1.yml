name: Build DIJI-NES Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:          # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # 编译（会自动生成 merged.bin，因为 platformio.ini 中有 board_build.merge_bin = true）
      - name: Build firmware
        run: pio run

      # 上传 firmware.bin（烧录地址 0x10000）
      - name: Upload firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: DIJI-NES-firmware
          path: .pio/build/*/firmware.bin

      # 上传 merged.bin（烧录地址 0x0）
      - name: Upload merged.bin
        uses: actions/upload-artifact@v4
        with:
          name: DIJI-NES-merged-firmware
          path: .pio/build/*/merged.bin